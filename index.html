    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Lexora",
        "url": "https://www.lexorawords.com",
        "description": "Free Scrabble word finder, crossword solver and word unscrambler with TWL (US) and SOWPODS (UK) dictionaries.",
        "sameAs": []
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Lexora",
        "url": "https://www.lexorawords.com",
        "inLanguage": "en",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.lexorawords.com/word-finder?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Lexora Word Tools",
        "url": "https://www.lexorawords.com",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Works without JavaScript for reading; JavaScript required for live solving.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Scrabble word finder ranked by tile score",
          "Crossword solver with wildcard letter patterns",
          "Word unscrambler and anagram solver",
          "TWL (US) and SOWPODS (UK) dictionary validation"
        ],
        "potentialAction": [
          {
            "@type": "SearchAction",
            "name": "Find Scrabble words from a rack",
            "target": "https://www.lexorawords.com/scrabble-solver?q={rack}",
            "query-input": "required name=rack"
          },
          {
            "@type": "SearchAction",
            "name": "Solve a crossword pattern",
            "target": "https://www.lexorawords.com/crossword-solver?q={pattern}",
            "query-input": "required name=pattern"
          },
          {
            "@type": "SearchAction",
            "name": "Unscramble letters",
            "target": "https://www.lexorawords.com/word-finder?q={letters}",
            "query-input": "required name=letters"
          }
        ]
      }
    </script>
